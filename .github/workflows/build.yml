
name: Build Example

on: [push]

jobs:
  build-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Bundle application
        run: zip -r calculator-app.zip . -x ".git/*" ".github/*" "calculator-app.zip"

      - name: Verify ZIP
        run: ls -lh calculator-app.zip
